server:
  # Render assigns the port dynamically via $PORT; 8080 stays the local-dev default.
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: roommate-management-backend

  datasource:
    # Built from separate DB_HOST/DB_PORT/DB_NAME vars (not one opaque SPRING_DATASOURCE_URL)
    # so a wrong value is visible/fixable as a single Render field instead of hunting inside a
    # concatenated JDBC string. sslMode=REQUIRED is mandatory for Aiven; defaults below only
    # apply to local dev.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:roommate_management}?sslMode=REQUIRED&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # Schema is owned by database/schema.sql, not Hibernate. "none" trusts that
      # migration as the source of truth instead of validating column-for-column
      # against it (safer across MySQL versions / minor type differences).
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 15MB

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    # No insecure fallback: this file is public (GitHub), so a default here would let anyone
    # forge valid tokens for any user in any deployment that forgot to set JWT_SECRET.
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}       # 24 hours
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}  # 7 days
  file-storage:
    base-dir: ${FILE_STORAGE_DIR:uploads}
    max-file-size-mb: 10
    allowed-image-types: image/jpeg,image/png,image/jpg,image/webp
    allowed-doc-types: image/jpeg,image/png,image/jpg,application/pdf
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:noreply@roomiehub.app}}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.roommate.management: INFO
    org.springframework.security: WARN
